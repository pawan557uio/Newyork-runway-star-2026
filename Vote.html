<script>

let selectedContestant = "";
let selectedVoteId = "";

const pricePerVote = 1;

function openVote(name, voteId) {

  selectedContestant = name;
  selectedVoteId = voteId;

  document.getElementById("selectedName").innerText =
    "Selected Contestant: " + name;

  document.getElementById("voteBox").style.display = "block";

  document.getElementById("voteBox").scrollIntoView({
    behavior: "smooth"
  });

}

function calculateAmount() {

  let votes = Number(
    document.getElementById("voteNumber").value
  );

  if (votes < 1) votes = 1;

  document.getElementById("amount").innerText =
    votes * pricePerVote;

}

function payForVotes() {

  let votes = Number(
    document.getElementById("voteNumber").value
  );

  if (!selectedContestant) {
    alert("Please select a contestant.");
    return;
  }

  if (votes < 1) {
    alert("Please enter valid votes.");
    return;
  }

  let amount = votes * pricePerVote;

  alert(
    "Contestant: " + selectedContestant +
    "\nVotes: " + votes +
    "\nAmount: $" + amount +
    "\n\nPayment gateway will be connected next."
  );

}

  <div class="header">

      <div class="contestant-info">

        <p>New York, USA</p>
      </div>
      <button class="vote-btn" onclick="selectContestant('Contestant 01')">

    <!-- Contestant 2 -->
    <div class="contestant">
      <img src="https://via.placeholder.com/100" alt="Contestant">

      </button>
    </div>

    <!-- Voting Box -->
    <div class="vote-box">

      <h2>Cast Your Vote</h2>

      <p id="selectedContestant">
        Please select a contestant.
      </p>

      <label>Number of Votes</label>

      <input
        type="number"
        id="voteCount"
        min="1"
        value="1"
        oninput="calculateTotal()"
      >

      <p id="total">
        Total: $1
      </p>

      <button class="pay-btn" onclick="startPayment()">
        Continue to Payment
      </button>

    </div>

  </div>

  <script>

    let selectedContestant = "";
    const pricePerVote = 1;

    function selectContestant(name) {
      selectedContestant = name;

      document.getElementById("selectedContestant").innerText =
        "Selected: " + name;

      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
      });
    }

    function calculateTotal() {

      let votes = Number(
        document.getElementById("voteCount").value
      );

      if (votes < 1) {
        votes = 1;
      }

      let total = votes * pricePerVote;

      document.getElementById("total").innerText =
        "Total: $" + total;
    }

    function startPayment() {

      if (selectedContestant === "") {
        alert("Please select a contestant first.");
        return;
      }

      let votes = Number(
        document.getElementById("voteCount").value
      );

      if (votes < 1) {
        alert("Please enter a valid number of votes.");
        return;
      }

      let total = votes * pricePerVote;

      alert(
        "Contestant: " +
        selectedContestant +
        "\nVotes: " +
        votes +
        "\nAmount: $" +
        total +
        "\n\nPayment gateway will be connected next."
      );
    }

  </script>
